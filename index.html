<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบเจ้าของร้าน - Tiger Cashbox Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #thermal-receipt, #thermal-receipt * { visibility: visible; }
      #thermal-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 78mm;
        margin: 0;
        padding: 0;
      }
    }
    .thermal-text {
      color: #000000 !important;
      font-family: 'Tahoma', 'Arial', sans-serif;
      font-weight: 900;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100">
  <div class="max-w-5xl mx-auto py-6 px-4">
    <!-- Owner Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl shadow-md mb-6 border border-slate-700">
      <div>
        <h1 class="text-2xl font-black text-amber-500 flex items-center gap-2">
          <span>👑 Tiger Cashbox</span>
          <span class="text-xs bg-purple-900 text-purple-200 border border-purple-500 px-2.5 py-0.5 rounded-full font-bold">Owner Portal</span>
        </h1>
        <p class="text-xs text-gray-400 mt-1">จัดการระบบคูปองระดับผู้บริหาร</p>
      </div>
      <div class="flex items-center gap-3">
        <label class="text-xs font-bold text-gray-400">ผู้ทำรายการ:</label>
        <input type="text" id="owner_name" value="Owner" class="border border-slate-600 rounded px-2.5 py-1 text-sm font-semibold bg-slate-700 text-white">
      </div>
    </header>

    <!-- Tabs -->
    <div class="flex border-b border-slate-700 gap-2 mb-6">
      <button onclick="switchTab('reissue')" id="tab-reissue" class="px-5 py-2.5 font-bold border-b-2 border-purple-500 text-purple-400 text-sm">★ ออกยอดใหม่ (พิเศษ)</button>
      <button onclick="switchTab('combine')" id="tab-combine" class="px-5 py-2.5 font-bold border-b-2 border-transparent text-gray-400 hover:text-amber-400 text-sm">รวมยอดคูปอง</button>
      <button onclick="switchTab('cancel')" id="tab-cancel" class="px-5 py-2.5 font-bold border-b-2 border-transparent text-gray-400 hover:text-amber-400 text-sm">ยกเลิกเดี่ยว</button>
      <button onclick="switchTab('history')" id="tab-history" class="px-5 py-2.5 font-bold border-b-2 border-transparent text-gray-400 hover:text-amber-400 text-sm">ประวัติ & Reprint</button>
    </div>

    <!-- Section: 1. Owner Reissue (ฟังก์ชันพิเศษ + Hidden Trigger **1) -->
    <div id="view-reissue" class="bg-slate-800 p-6 rounded-xl border border-purple-900 shadow-xl">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
        <h2 class="text-lg font-black text-purple-400">ยกเลิกคูปองเดิม และออกยอดใหม่ (Owner Reissue)</h2>
        <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">Normal View</span>
      </div>

      <div class="max-w-md space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">รหัสคูปองเดิม 12 หลัก *</label>
          <input type="text" id="reissue_old_code" maxlength="12" placeholder="กรอกรหัส 12 หลัก" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm font-mono font-bold text-amber-400 uppercase">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">ยอดเงิน</label>
          <!-- ช่องกรอกยอดเงินหน้าตาปกติ พร้อมรับ Trigger **1 เมื่อกด Enter -->
          <input type="text" id="reissue_amount_input" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-lg font-black text-white">
          <p class="text-[11px] text-gray-500 mt-1">กรอกยอดเงินแล้วกด Enter</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">หมายเหตุ / เหตุผลการแก้ไข</label>
          <input type="text" id="reissue_note" placeholder="เหตุผลการปรับปรุงยอด" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm text-gray-200">
        </div>

        <button onclick="submitOwnerReissueManual()" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-black py-2.5 rounded-lg text-sm transition">
          บันทึกและออกคูปอง
        </button>
      </div>
    </div>

    <!-- Section: 2. รวมยอดคูปอง -->
    <div id="view-combine" class="bg-slate-800 p-6 rounded-xl border border-slate-700 hidden">
      <h2 class="text-lg font-black text-amber-400 mb-4 pb-2 border-b border-slate-700">รวมยอดคูปอง</h2>
      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-300 mb-1">เลขที่บิล / Ref</label>
        <input type="text" id="owner_combine_ref" placeholder="REF-XXXX" class="w-full max-w-sm bg-slate-900 border border-slate-700 p-2 rounded text-sm text-white">
      </div>
      <div id="owner-combine-inputs" class="space-y-2 mb-4">
        <input type="text" maxlength="12" class="owner-v-input bg-slate-900 border border-slate-700 p-2 rounded text-sm font-mono font-bold w-64 uppercase" placeholder="คูปองใบที่ 1">
        <input type="text" maxlength="12" class="owner-v-input bg-slate-900 border border-slate-700 p-2 rounded text-sm font-mono font-bold w-64 uppercase" placeholder="คูปองใบที่ 2">
      </div>
      <button onclick="addOwnerCombineRow()" class="text-xs bg-slate-700 hover:bg-slate-600 text-white font-bold px-3 py-1.5 rounded mb-4">+ เพิ่มใบ</button><br>
      <button onclick="processOwnerCombine()" class="bg-amber-600 hover:bg-amber-700 text-white font-black px-6 py-2 rounded-lg text-sm">รวมคูปอง</button>
    </div>

    <!-- Section: 3. ยกเลิกเดี่ยว -->
    <div id="view-cancel" class="bg-slate-800 p-6 rounded-xl border border-slate-700 hidden">
      <h2 class="text-lg font-black text-red-400 mb-4 pb-2 border-b border-slate-700">ยกเลิกคูปองเดี่ยว (VOID)</h2>
      <div class="max-w-md space-y-4">
        <input type="text" id="owner_cancel_code" maxlength="12" placeholder="รหัสคูปอง 12 หลัก" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded font-mono font-bold uppercase">
        <input type="text" id="owner_cancel_reason" placeholder="เหตุผล" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm">
        <button onclick="processOwnerCancel()" class="bg-red-600 hover:bg-red-700 text-white font-black px-6 py-2 rounded-lg text-sm">ยกเลิกทันที</button>
      </div>
    </div>

    <!-- Section: 4. ประวัติ & Reprint -->
    <div id="view-history" class="bg-slate-800 p-6 rounded-xl border border-slate-700 hidden">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
        <h2 class="text-lg font-black text-slate-200">ประวัติการทำรายการ</h2>
        <button onclick="loadOwnerHistory()" class="text-xs bg-slate-700 px-3 py-1.5 rounded">รีเฟรช</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="bg-slate-900 text-gray-400 border-b border-slate-700">
              <th class="p-2.5">เวลา</th>
              <th class="p-2.5">TX ID / Ref</th>
              <th class="p-2.5">ประเภท</th>
              <th class="p-2.5">ผู้ทำรายการ</th>
              <th class="p-2.5">ยอดเงิน</th>
              <th class="p-2.5">รหัสคูปองใหม่</th>
              <th class="p-2.5 text-center">Reprint</th>
              <th class="p-2.5 text-right">พิมพ์ซ้ำ</th>
            </tr>
          </thead>
          <tbody id="owner-history-rows" class="divide-y divide-slate-700"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Thermal Print -->
  <div id="thermal-receipt" class="hidden"></div>

  <script>
    const SUPABASE_URL = "https://vwsidnehgijyinuxqzqy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3c2lkbmVoZ2lqeWludXhxenF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjI4MjcsImV4cCI6MjEwNTEzODgyN30.NiTeJBRKXAj3uy_32FtH--MupCyTNG2YpVypIsleyF8";
    const EDGE_FUNCTION_URL = "https://vwsidnehgijyinuxqzqy.supabase.co/functions/v1/tiger-api";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(tab) {
      ['reissue', 'combine', 'cancel', 'history'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "px-5 py-2.5 font-bold border-b-2 border-transparent text-gray-400 hover:text-amber-400 text-sm";
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "px-5 py-2.5 font-bold border-b-2 border-purple-500 text-purple-400 text-sm";
      if (tab === 'history') loadOwnerHistory();
    }

    async function callTiger(action, payload) {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, payload })
      });
      return await res.json();
    }

    function generateQRDataURL(text) {
      return new Promise((resolve) => {
        const tempDiv = document.createElement('div');
        new QRCode(tempDiv, {
          text: text,
          width: 150,
          height: 150,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
        setTimeout(() => {
          const img = tempDiv.querySelector('img');
          resolve(img ? img.src : '');
        }, 80);
      });
    }

    // --- กลไกลับ (HIDDEN TRIGGER **1) ---
    const amtInput = document.getElementById('reissue_amount_input');
    amtInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const rawVal = amtInput.value.trim();
        // ตรวจจับว่าลงท้ายด้วย **1 หรือไม่ เช่น 33.6**1
        if (rawVal.endsWith('**1')) {
          const cleanVal = rawVal.replace('**1', '');
          amtInput.value = cleanVal;
          triggerOwnerReissue(cleanVal);
        } else {
          submitOwnerReissueManual();
        }
      }
    });

    function submitOwnerReissueManual() {
      const val = amtInput.value.trim().replace('**1', '');
      triggerOwnerReissue(val);
    }

    async function triggerOwnerReissue(amountStr) {
      const oldCode = document.getElementById('reissue_old_code').value.trim().toUpperCase();
      const note = document.getElementById('reissue_note').value.trim() || 'Owner Authorized';
      const owner = document.getElementById('owner_name').value.trim() || 'Owner';
      const finalAmount = parseFloat(amountStr);

      if (!oldCode || oldCode.length < 5) return alert("กรุณาระบุรหัสคูปองเดิมให้ถูกต้อง");
      if (isNaN(finalAmount) || finalAmount <= 0) return alert("กรุณาระบุยอดเงินที่ถูกต้อง");

      try {
        // 1. ยกเลิกคูปองเดิม
        await callTiger("cancel", { voucher_num: oldCode });

        // 2. สร้างคูปองใหม่ตามยอดที่ระบุ
        const txId = `OW-${Date.now()}`;
        const createRes = await callTiger("create", {
          amount: finalAmount.toFixed(2),
          ref_num: txId,
          note: `Owner Reissued from ${oldCode}: ${note}`
        });

        const newCode = createRes?.result?.[0] || createRes?.[0];
        if (!newCode) throw new Error("Tiger ไม่ได้คืนค่ารหัสคูปองใหม่");

        // 3. บันทึกประวัติ Supabase
        await supabase.from('voucher_transactions').insert({
          transaction_id: txId,
          action_type: 'OWNER_REISSUE',
          staff_name: owner,
          total_amount: finalAmount,
          new_voucher_code: newCode,
          old_vouchers: [{ code: oldCode, amount: 0 }],
          ref_num: txId,
          error_message: note
        });

        // 4. พิมพ์สลิปพิเศษ (ไม่มีบรรทัดส่วนต่าง)
        await printOwnerReissueSlip({
          txId,
          dateStr: new Date().toLocaleString('th-TH'),
          owner,
          oldCode,
          newAmount: finalAmount.toFixed(2),
          newCode
        });

        alert("ออกคูปองใหม่และพิมพ์สลิปเรียบร้อย");
        location.reload();
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      }
    }

    // สลิป Owner Reissue
    async function printOwnerReissueSlip(data) {
      const qrDataUrl = await generateQRDataURL(data.newCode);
      const printBox = document.getElementById('thermal-receipt');

      printBox.innerHTML = `
        <div class="thermal-text" style="width: 78mm; padding: 4mm; margin: auto;">
          ${data.isReprint ? `<div style="text-align: center; border: 2px solid #000; padding: 2px; margin-bottom: 5px;">*** REPRINT SLIP (โดย: ${data.reprintBy}) ***</div>` : ''}
          <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 4px;">
            <div style="font-size: 15px;">ใบอนุมัติคูปอง (พิเศษ)</div>
            <div style="font-size: 11px;">[ เอกสารภายในร้าน - ไม่มอบให้ลูกค้า ]</div>
          </div>
          <div style="font-size: 12px; margin-top: 6px; line-height: 1.4;">
            <div>วันที่-เวลา: ${data.dateStr}</div>
            <div>ผู้อนุมัติ: ${data.owner} | TX: ${data.txId}</div>
            <div>รหัสเดิมที่ยกเลิก: <span style="font-family: monospace;">${data.oldCode}</span></div>
          </div>
          
          <div style="border: 2px solid #000; padding: 6px; text-align: center; margin: 8px 0; font-size: 16px;">
            ยอดเงินใหม่สุทธิ: ${data.newAmount} บาท
          </div>

          <div style="text-align: center; margin-top: 6px;">
            <div style="font-size: 18px; letter-spacing: 2px; margin: 4px 0; font-family: monospace;">
              ${data.newCode.replace(/(\d{4})/g, '$1 ').trim()}
            </div>
            <div style="display: flex; justify-content: center; margin: 6px 0;">
              <img src="${qrDataUrl}" style="width: 140px; height: 140px; image-rendering: pixelated;" />
            </div>
          </div>
        </div>
      `;

      window.print();
    }

    async function loadOwnerHistory() {
      const tbody = document.getElementById('owner-history-rows');
      tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-500">กำลังโหลด...</td></tr>`;

      const { data, error } = await supabase
        .from('voucher_transactions')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(50);

      if (error) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-400">โหลดข้อมูลล้มเหลว</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr class="hover:bg-slate-700/50 border-b border-slate-700">
          <td class="p-2.5">${new Date(item.created_at).toLocaleString('th-TH')}</td>
          <td class="p-2.5 font-mono text-gray-300">${item.transaction_id}</td>
          <td class="p-2.5">
            <span class="px-2 py-0.5 rounded text-[10px] font-black ${item.action_type === 'OWNER_REISSUE' ? 'bg-purple-900 text-purple-200' : 'bg-slate-700 text-gray-300'}">
              ${item.action_type}
            </span>
          </td>
          <td class="p-2.5">${item.staff_name}</td>
          <td class="p-2.5 font-bold text-amber-400">${parseFloat(item.total_amount).toFixed(2)}</td>
          <td class="p-2.5 font-mono text-gray-500">${item.new_voucher_code ? '••••••••' + item.new_voucher_code.slice(-4) : '-'}</td>
          <td class="p-2.5 text-center">${item.reprint_count}</td>
          <td class="p-2.5 text-right">
            <button onclick='reprintOwnerRecord(${JSON.stringify(item)})' class="bg-slate-700 hover:bg-slate-600 text-white px-2 py-1 rounded text-xs">Reprint</button>
          </td>
        </tr>
      `).join('');
    }

    async function reprintOwnerRecord(item) {
      const repStaff = prompt("ระบุชื่อผู้อนุมัติพิมพ์ซ้ำ:", document.getElementById('owner_name').value);
      if (!repStaff) return;

      await supabase.from('voucher_transactions').update({
        reprint_count: (item.reprint_count || 0) + 1,
        last_reprint_at: new Date().toISOString(),
        reprinted_by: repStaff
      }).eq('id', item.id);

      if (item.action_type === 'OWNER_REISSUE') {
        printOwnerReissueSlip({
          txId: item.transaction_id,
          dateStr: new Date(item.created_at).toLocaleString('th-TH'),
          owner: item.staff_name,
          oldCode: item.old_vouchers?.[0]?.code || '-',
          newAmount: parseFloat(item.total_amount).toFixed(2),
          newCode: item.new_voucher_code,
          isReprint: true,
          reprintBy: repStaff
        });
      }
    }
  </script>
</body>
</html>
